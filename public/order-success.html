<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Lumière</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page">
<nav class="lum-nav">
  <a href="/" class="logo">Lumière</a>
  <ul><li><a href="/#collection">Collection</a></li></ul>
  <div class="nav-actions"><a href="/account.html" data-acct-link>Sign In</a><button class="nav-cart" data-cart-count onclick="openCart()">Bag (0)</button></div>
</nav>
<main class="page-main" style="text-align:center;max-width:640px">
  <div class="page-sub" style="color:var(--gold)">— ✦ Confirmed ✦ —</div>
  <h1 class="page-title">Thank <em>you</em></h1>
  <p class="muted" style="margin:1.4rem 0 2.4rem">Your Lumière order has been placed. We'll reach out shortly with shipping details.</p>
  <div id="orderBox" class="order-card" style="text-align:left"></div>
  <div style="margin-top:2rem">
    <a href="/" class="btn">Back to Home</a>
    <a href="/account.html" class="btn btn-ghost">View Orders</a>
  </div>
</main>
<footer class="lum-footer">© 2026 Lumière by Yasra</footer>
<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head"><h3>Your Bag</h3><button class="cart-close" onclick="closeCart()">×</button></div>
  <div class="cart-body" id="cartItems"></div>
  <div class="cart-foot"><div class="row"><span>Subtotal</span><span class="total" id="cartSubtotal">PKR 0</span></div><a href="/checkout.html" class="btn btn-primary btn-block">Checkout</a></div>
</aside>
<script src="/app.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const box=document.getElementById('orderBox');
if(!id){ box.innerHTML='<p class="muted">No order id provided.</p>'; }
else{
  api('/orders/'+id).then(o=>{
    box.innerHTML=`
      <div class="head"><h4>Order #${o.id}</h4><span class="badge badge-${o.status}">${o.status}</span></div>
      ${o.items?`<ul>${o.items.map(i=>`<li>${i.name} × ${i.qty} <span style="float:right">${fmt(i.price*i.qty)}</span></li>`).join('')}</ul>`:''}
      <div style="margin-top:1rem;display:flex;justify-content:space-between;font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--gold)"><span>Total</span><span>${fmt(o.total)}</span></div>
      <p class="muted" style="margin-top:0.8rem">Payment: ${o.payment_method||'cod'} · ${o.payment_status||'unpaid'}</p>`;
  }).catch(e=>box.innerHTML=`<p class="muted">${e.message}</p>`);
}
</script>
</body>
</html>
